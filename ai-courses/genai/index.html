<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>Skill-Lite Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>/* Layout: fixed left rail (nav) + fluid workspace; reader uses article + sticky outline.
   Motif: the attention map, lessons as cells in a heat grid that warms as you learn. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --surface-2: #e3e9ed;
  --surface-3: #d5dee4;
  --ink: #0f1d2a;
  --ink-2: #4a5b6a;
  --ink-3: #7b8b98;
  --line: #d3dce2;
  --accent: #0b7f7a;
  --accent-ink: #ffffff;
  --accent-soft: #d3ecea;
  --heat: #e8892c;
  --heat-soft: #fbe6cf;
  --good: #1f8a4c;
  --good-soft: #d9f0e2;
  --bad: #c2412d;
  --bad-soft: #f8dcd6;
  --code-bg: #f5f8fa;
  --shadow: 0 1px 2px rgba(15, 29, 42, .06), 0 8px 24px rgba(15, 29, 42, .06);
  --m0: #6b7a88; --m1: #0b7f7a; --m2: #c25b2a; --m3: #3a62c9; --m4: #9a4fb5; --m5: #2f8f46; --m6: #c4366b; --m7: #a67a00;
  --hl-kw: #9a3fb0; --hl-str: #1f7a3d; --hl-num: #b5560f; --hl-com: #7b8b98; --hl-fn: #2a5bc4; --hl-ty: #0b7f7a;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
  --side-w: 244px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c141c; --surface: #131e29; --surface-2: #1a2835; --surface-3: #233544; --ink: #e4ecf2; --ink-2: #9db0bf; --ink-3: #6f8494;
    --line: #243443; --accent: #3cc3b8; --accent-ink: #062320; --accent-soft: #123a3a; --heat: #f2a04b; --heat-soft: #3d2b17;
    --good: #4cc47d; --good-soft: #143322; --bad: #f07a63; --bad-soft: #3d1d17; --code-bg: #0f1922;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --m0: #8d9daa; --m1: #3cc3b8; --m2: #ef8a55; --m3: #7d9df0; --m4: #c58ade; --m5: #5fc47a; --m6: #ee6f9d; --m7: #d8ab2e;
    --hl-kw: #d199e6; --hl-str: #7fd39a; --hl-num: #f3a76a; --hl-com: #6f8494; --hl-fn: #8fb2f5; --hl-ty: #5fd3c8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c141c; --surface: #131e29; --surface-2: #1a2835; --surface-3: #233544; --ink: #e4ecf2; --ink-2: #9db0bf; --ink-3: #6f8494;
  --line: #243443; --accent: #3cc3b8; --accent-ink: #062320; --accent-soft: #123a3a; --heat: #f2a04b; --heat-soft: #3d2b17;
  --good: #4cc47d; --good-soft: #143322; --bad: #f07a63; --bad-soft: #3d1d17; --code-bg: #0f1922;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --m0: #8d9daa; --m1: #3cc3b8; --m2: #ef8a55; --m3: #7d9df0; --m4: #c58ade; --m5: #5fc47a; --m6: #ee6f9d; --m7: #d8ab2e;
  --hl-kw: #d199e6; --hl-str: #7fd39a; --hl-num: #f3a76a; --hl-com: #6f8494; --hl-fn: #8fb2f5; --hl-ty: #5fd3c8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); }
.muted { color: var(--ink-2); }
.tiny { font-size: 12px; }
.eyebrow { font: 600 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px;
  padding: max(18px, env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px)); z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font: 800 17px/1.05 var(--f-display); letter-spacing: -.01em; }
.brand-sub { font: 500 11px/1.2 var(--f-mono); color: var(--ink-3); letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 8px;
  color: var(--ink-2); font-weight: 500; text-align: left; width: 100%;
}
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-btn .badge { margin-left: auto; font: 600 11px var(--f-mono); background: var(--heat); color: #fff; border-radius: 99px; padding: 1px 7px; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.side-foot { margin-top: auto; padding: 14px 8px 0; display: grid; gap: 8px; }
.side-meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.side-meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }

.main-wrap { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.menu-btn { display: none; border: 0; background: none; padding: 6px; border-radius: 8px; }
.menu-btn svg { width: 22px; height: 22px; }
.crumb { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.search { position: relative; margin-left: auto; width: min(380px, 46vw); }
.search input {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); outline: none;
}
.search input:focus { border-color: var(--accent); }
.search > svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 11px var(--f-mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.search-results {
  position: absolute; right: 0; top: calc(100% + 6px); width: min(520px, 92vw); max-height: 60vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
}
.sr-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; }
.sr-item:hover, .sr-item.active { background: var(--surface-2); }
.sr-item b { display: block; font-weight: 600; }
.sr-item span { font-size: 13px; color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-item mark { background: var(--heat-soft); color: inherit; border-radius: 3px; }

main#main {
  padding-block: 28px 80px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  width: 100%; max-width: 1240px; margin: 0 auto; min-width: 0;
}
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.view-head h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; letter-spacing: -.02em; }
.view-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 62ch; }

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font: 500 12px var(--f-mono); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--heat-soft); color: var(--heat); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.select, .field {
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; max-width: 100%;
}
textarea.field { width: 100%; resize: vertical; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s; }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-2); }
.empty h3 { color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
#toast {
  position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 16px)); transform: translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 500; pointer-events: none; transition: .25s; z-index: 100;
  max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: none; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.hero-main { padding: 28px; position: relative; overflow: hidden; }
.hero-main h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -.025em; margin: 6px 0 10px; }
.hero-main p { color: var(--ink-2); margin: 0 0 18px; max-width: 52ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.continue { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 12px; background: var(--surface-2); margin-bottom: 16px; border: 0; width: 100%; text-align: left; }
.continue:hover { background: var(--surface-3); }
.continue .ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: #fff; font: 700 14px var(--f-mono); flex: none; }
.continue b { display: block; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.stat .v { font: 800 28px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.stat .l { font-size: 13px; color: var(--ink-2); margin-top: 6px; }

.attn { overflow-x: auto; padding-bottom: 4px; }
.attn-grid { display: grid; grid-template-columns: 150px repeat(9, 30px); gap: 5px; align-items: center; min-width: 440px; }
.attn-grid .rl { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.attn-grid .cl { font: 11px var(--f-mono); color: var(--ink-3); text-align: center; }
.cell {
  width: 30px; height: 30px; border-radius: 6px; border: 0; background: var(--surface-2); position: relative;
  transition: transform .15s; padding: 0;
}
.cell:hover { transform: scale(1.12); z-index: 2; box-shadow: 0 0 0 2px var(--ink); }
.cell[data-s="1"] { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); }
.cell[data-s="2"] { background: color-mix(in srgb, var(--accent) 55%, var(--surface-2)); }
.cell[data-s="3"] { background: var(--accent); }
.cell[data-s="4"] { background: var(--heat); }
.cell.cur::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--surface); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mod-card {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  transition: transform .15s, box-shadow .15s; min-width: 0;
}
.mod-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.mod-card h3 { font-size: 17px; font-weight: 700; }
.mod-card p { margin: 0; font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mod-top { display: flex; justify-content: space-between; align-items: center; }
.mod-num { font: 700 12px var(--f-mono); padding: 3px 8px; border-radius: 6px; color: #fff; }
.mod-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: auto; }

/* ---------- course index ---------- */
.mod-block { margin-bottom: 26px; }
.mod-block-head { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.mod-block-head h2 { font-size: 21px; font-weight: 700; }
.lesson-list { display: grid; gap: 6px; }
.lesson-row {
  display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-align: left; width: 100%;
}
.lesson-row:hover { border-color: var(--ink-3); }
.lesson-row .n { font: 600 13px var(--f-mono); color: var(--ink-3); }
.lesson-row .t { font-weight: 600; min-width: 0; }
.lesson-row .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.check.on { background: var(--good); border-color: var(--good); color: #fff; }
.check svg { width: 13px; height: 13px; }

/* ---------- reader ---------- */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 40px; align-items: start; }
.progress-line { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; background: var(--heat); z-index: 50; transition: width .1s; }
.lesson-hero { padding-bottom: 20px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.lesson-hero h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; letter-spacing: -.025em; margin: 10px 0 14px; }
.lesson-hero .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lesson-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.toc { position: sticky; top: 84px; max-height: calc(100vh - 110px); overflow: auto; font-size: 13px; }
.toc a { display: block; color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-left: 2px solid var(--line); line-height: 1.35; }
.toc a.l3 { padding-left: 22px; font-size: 12.5px; }
.toc a:hover { color: var(--ink); }
.toc a.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.toc-box { display: grid; gap: 14px; }
.notes textarea { min-height: 120px; font-size: 13px; }

.md { max-width: 74ch; font-size: 16px; line-height: 1.72; min-width: 0; }
.md > *:first-child { margin-top: 0; }
.md h2 { font-size: 26px; font-weight: 750; margin: 2.2em 0 .6em; padding-top: .3em; scroll-margin-top: 80px; letter-spacing: -.015em; }
.md h3 { font-size: 19px; font-weight: 700; margin: 1.8em 0 .5em; scroll-margin-top: 80px; }
.md h4 { font-size: 16px; font-weight: 700; margin: 1.5em 0 .4em; }
.md p { margin: 0 0 1em; }
.md a, .md :not(pre) > code { overflow-wrap: anywhere; }
.md ul, .md ol { padding-left: 1.4em; margin: 0 0 1em; }
.md li { margin: .25em 0; }
.md li::marker { color: var(--ink-3); }
.md strong { font-weight: 600; color: var(--ink); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.md blockquote { margin: 1.2em 0; padding: 12px 16px; border-left: 3px solid var(--heat); background: var(--heat-soft); border-radius: 0 8px 8px 0; color: var(--ink); }
.md blockquote p:last-child { margin: 0; }
.md code { font: .88em var(--f-mono); background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
.md pre { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; overflow-x: auto; margin: 1.2em 0; font-size: 13.5px; line-height: 1.55; }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md pre .copy { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .15s; }
.md pre:hover .copy, .md pre .copy:focus { opacity: 1; }
.md .tbl { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--line); border-radius: 10px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md th, .md td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md img { max-width: 100%; border-radius: 8px; }
.md .mermaid { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; text-align: center; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in { color: var(--hl-kw); }
.hljs-string, .hljs-attr-value, .hljs-template-variable { color: var(--hl-str); }
.hljs-number, .hljs-literal { color: var(--hl-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-function .hljs-title, .hljs-title.function_ { color: var(--hl-fn); }
.hljs-type, .hljs-class .hljs-title, .hljs-title.class_, .hljs-params { color: var(--hl-ty); }
.hljs-attr, .hljs-variable { color: var(--hl-fn); }
.lesson-end { margin-top: 48px; padding: 22px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 14px; }
.lesson-end .row { display: flex; flex-wrap: wrap; gap: 10px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    S.byId._mods[m.id] = m;

function runSearch(q) {
  const box = $("#search-results"); q = q.trim().toLowerCase();

  const out = [];
  for (const l of S.lessons) {
    let score = 0, snippet = "", anchor = "";
    if (l.title.toLowerCase().includes(q)) score += 10;
    for (const h of l.outline) for (const x of [h, ...h.c]) if (x.t.toLowerCase().includes(q)) { score += 4; if (!anchor) { anchor = x.t; snippet = x.t; } }
    const at = l._lc.indexOf(q);

    if (score) out.push({ l, score, snippet, anchor });

  out.sort((a, b) => b.score - a.score);
  const hl = (s) => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
  box.innerHTML = out.length ? out.slice(0, 12).map((r, i) => `<button class="sr-item${i ? "" : " active"}" data-id="${r.l.id}" data-anchor="${esc(r.anchor)}"><b>${r.l.num} · ${hl(r.l.title)}</b><span>${hl(r.snippet || r.l.mod.title)}</span></button>`).join("")

function poolFor(mods) { return S.lessons.filter((l) => mods.includes(l.module)).flatMap((l) => l.quiz.map((q) => ({ ...q, lid: l.id, mid: l.module }))); }
function startExam() {
  const sel = S.examSel; const pool = poolFor(sel.mods);
  // round-robin across modules so every module is represented
  const byMod = {}; shuffle(pool).forEach((q) => (byMod[q.mid] ||= []).push(q));
  const qs = []; const keys = Object.keys(byMod);
  while (qs.length < Math.min(sel.n, pool.length)) for (const k of keys) { const q = byMod[k].pop(); if (q && qs.length < sel.n) qs.push(q); }
  const qq = shuffle(qs).map((q) => { const order = shuffle(q.o.map((_, i) => i)); return { ...q, o: order.map((i) => q.o[i]), a: order.indexOf(q.a) }; });
  S.exam = { running: true, qs: qq, i: 0, answers: {}, flags: {}, end: sel.timed ? Date.now() + qq.length * 72000 : null, confirm: false };

}
function tickExam() {
  const E = S.exam; if (!E?.running) { clearInterval(S.examTimer); return; }
  const left = Math.max(0, E.end - Date.now()); const t = $("#timer");
  if (t) { t.textContent = fmtTime(left); t.classList.toggle("low", left < 60000); }

function bindPanZoom(svg) {
  svg._bound = true; const pts = new Map(); let last = null, pinch = null;
  svg.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, e); svg.setPointerCapture(e.pointerId); S.map.dragged = false; last = { x: e.clientX, y: e.clientY }; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); } });
  svg.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); const r = svg.getBoundingClientRect(); zoomAt(d / pinch, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top); pinch = d; S.map.dragged = true; return; }
    const dx = e.clientX - last.x, dy = e.clientY - last.y; if (Math.abs(dx) + Math.abs(dy) > 3) { S.map.dragged = true; svg.classList.add("drag"); }
    if (S.map.dragged) { S.map.view.x += dx; S.map.view.y += dy; applyView(); } last = { x: e.clientX, y: e.clientY };
  });
  const up = (e) => { pts.delete(e.pointerId); pinch = null; svg.classList.remove("drag"); setTimeout(() => (S.map.dragged = false), 0); };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("wheel", (e) => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
}

// ---------- progress ----------
function renderProgress() {
  const core = coreLessons(); const done = core.filter((l) => P.completed[l.id]).length;
  const hoursDone = core.filter((l) => P.completed[l.id]).reduce((a, l) => a + (l.hours || 0), 0);
  const bestExam = P.exams.length ? Math.max(...P.exams.map((x) => x.score)) : null;
  const quizzes = Object.entries(P.quiz).sort((a, b) => b[1].ts - a[1].ts);
  const weeks = 18; const start = new Date(Date.now() - (weeks * 7 - 1) * DAY); start.setDate(start.getDate() - start.getDay());
  let cells = ""; for (let t = start.getTime(); t <= Date.now(); t += DAY) { const d = new Date(t).toISOString().slice(0, 10); const v = P.days[d] || 0; cells += `<i data-l="${v ? (v < 3 ? 1 : v < 8 ? 2 : 3) : 0}" title="${d}: ${v} activities"></i>`; }
  $("#main").innerHTML = `<div class="view-head"><div><div class="eyebrow">Your journey</div><h1>Progress</h1><p>Everything is saved in this browser on this device.${memOnly ? " <b>Storage is blocked here, so progress will reset when you leave.</b>" : ""} Use a backup code to move it to another device.</p></div></div>
  <div class="kpis">
    <div class="stat"><div class="v">${pct(done, core.length)}<small>%</small></div><div class="l">${done} of ${core.length} lessons completed</div></div>
    <div class="stat"><div class="v">${Math.round(hoursDone)}<small> h</small></div><div class="l">Of study material finished</div></div>
    <div class="stat"><div class="v">${streak()}<small> ${streak() === 1 ? "day" : "days"}</small></div><div class="l">Current streak</div></div>
    <div class="stat"><div class="v">${bestExam ?? "—"}${bestExam != null ? "<small>%</small>" : ""}</div><div class="l">Best exam score${bestExam != null && bestExam >= 70 ? " · passed" : ""}</div></div>
  </div>
  <div class="two" style="margin-bottom:16px">
    <section class="panel"><div class="panel-head"><h2>Modules</h2></div><div class="mod-progress">${S.modules.filter((m) => m.id !== "m0").map((m) => { const d = m.lessons.filter((l) => P.completed[l.id]).length; return `<div class="mp-row"><span><span class="dot" style="background:${modColor(m.id)}"></span> ${esc(m.title)}</span><div class="bar"><i style="width:${pct(d, m.lessons.length)}%;background:${modColor(m.id)}"></i></div><span class="num">${d}/${m.lessons.length}</span></div>`; }).join("")}</div></section>
    <section class="panel"><div class="panel-head"><h2>Study activity</h2><span class="tiny muted">Last ${weeks} weeks</span></div><div class="streak">${cells}</div>
      <div class="legend"><span><i style="background:var(--surface-2)"></i>None</span><span><i style="background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))"></i>Light</span><span><i style="background:color-mix(in srgb,var(--accent) 65%,var(--surface-2))"></i>Steady</span><span><i style="background:var(--accent)"></i>Deep work</span></div></section>
  </div>
  <section class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>Quiz results</h2></div>${quizzes.length ? `<div class="tbl-wrap"><table class="data"><thead><tr><th>Lesson</th><th>Best</th><th>Last</th><th>Attempts</th></tr></thead><tbody>${quizzes.map(([id, r]) => `<tr><td>${S.byId[id] ? `${S.byId[id].num} ${esc(S.byId[id].title)}` : id}</td><td><span class="chip ${r.best >= 80 ? "ok" : "warn"}">${r.best}%</span></td><td>${r.last}%</td><td>${r.attempts}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty" style="padding:20px"><h3>No quizzes yet</h3><p>Finish a lesson, then take its quiz.</p><button class="btn primary" data-go="quiz" style="margin-top:10px">Browse quizzes</button></div>`}</section>
  <section class="panel"><div class="panel-head"><div><h2>Backup and restore</h2><div class="tiny muted">Copy your backup code and paste it into this app on another device or browser.</div></div></div>
    <div class="grid" style="gap:10px"><textarea class="field mono" id="bk" rows="3" placeholder="Paste a backup code here to restore…" style="font-size:12px"></textarea>
    <div class="hero-actions"><button class="btn" id="bk-copy">${icon("copy")}Copy my backup code</button><button class="btn" id="bk-load">Restore from code</button><button class="btn ghost" id="bk-reset" style="margin-left:auto;color:var(--bad)">Reset all progress</button></div><div id="bk-confirm"></div></div></section>`;
  bindGo($("#main"));
  $("#bk-copy").onclick = () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify(P)))); $("#bk").value = code; navigator.clipboard?.writeText(code).then(() => toast("Backup code copied"), () => { $("#bk").select(); toast("Code selected. Press Ctrl+C to copy"); }); };
  $("#bk-load").onclick = () => { try { const obj = JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim())))); if (!obj || typeof obj !== "object" || !obj.completed) throw 0; P = Object.assign(blank(), obj); saveP(); toast("Progress restored"); renderProgress(); updateChrome(); } catch { toast("That code isn't valid. Copy it again from the other device."); } };
  $("#bk-reset").onclick = () => { $("#bk-confirm").innerHTML = `<div class="confirm"><b>Erase all progress, notes, quiz scores and flashcard history?</b><span class="tiny">This can't be undone unless you've saved a backup code.</span><div class="hero-actions"><button class="btn sm" id="rs-yes" style="color:var(--bad)">Erase everything</button><button class="btn sm" id="rs-no">Cancel</button></div></div>`; $("#rs-yes").onclick = () => { P = blank(); saveP(); toast("Progress reset"); renderProgress(); updateChrome(); }; $("#rs-no").onclick = () => ($("#bk-confirm").innerHTML = ""); };
}

boot();
</script>
</body></html>
